[settings]
build_type=Release

[conf]
tools.system.package_manager:mode=install
tools.system.package_manager:sudo=True

[options]
openscenegraph-mr/*:shared=True
qt/*:shared=True
qt/*:openssl=False
qt/*:with_pq=False
skybolt/*:enable_bullet=True
skybolt/*:enable_docs=True
skybolt/*:enable_examples=True
skybolt/*:enable_jsbsim=True
skybolt/*:enable_python=True
site_name: Skybolt
use_directory_urls: false

theme:
  name: material
  color_mode: auto
  user_color_mode_toggle: true
  features:
    - navigation.indexes

nav:
  - Overview: index.md
  - Getting Started: getting_started.md
  - Building from Source: building_from_source.md
  - Asset Packages: asset_packages.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - Coordinate Systems: coordinate_systems.md
  - Entities: entities.md
  - Python API:
    - python_api/index.md
    - skybolt: python_api/skybolt.md
    - skybolt_util: python_api/skybolt_util.md
    - Basic Usage Example: python_api/basic_usage_example.md

hooks:
  - Tools/BuildScripts/docs/hooks/setup_skybolt_environment.py
  - Tools/BuildScripts/docs/hooks/generate_components_doc.py
  - Tools/BuildScripts/docs/hooks/python_docstrings_validation.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_if_no_docstring: true
            show_source: false
            show_root_heading: false
            show_root_toc_entry: false
            show_symbol_type_heading: true
            show_category_heading: true
            heading_level: 3
            filters:
              - "!^__.*__$"  # Exclude all magic methods
              - "!^_pybind11_.*_$"  # Exclude pybind11 internal details

markdown_extensions:
  - pymdownx.snippets:
      base_path: ["."]